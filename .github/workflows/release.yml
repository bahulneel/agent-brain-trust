name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'release'
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/checkout@v4
        if: github.event_name != 'release'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack release archives
        run: |
          mkdir -p release/plugins release/skills
          cd dist
          zip -q -r ../release/plugins/agent-brain-trust-cursor-plugin.zip agent-brain-trust-cursor-plugin
          zip -q -r ../release/plugins/agent-brain-trust-claude-plugin.zip agent-brain-trust-claude-plugin
          zip -q -r ../release/plugins/agent-brain-trust-mcp.zip agent-brain-trust-mcp
          cp skill-zips/*.zip ../release/skills/
      - name: Upload Cursor plugin artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-cursor-plugin
          path: release/plugins/agent-brain-trust-cursor-plugin.zip
      - name: Upload Claude plugin artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-claude-plugin
          path: release/plugins/agent-brain-trust-claude-plugin.zip
      - name: Upload MCP artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-mcp
          path: release/plugins/agent-brain-trust-mcp.zip
      - name: Upload skill zip artefacts
        uses: actions/upload-artifact@v4
        with:
          name: brain-trust-skill-zips
          path: release/skills/*.zip
      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/plugins/agent-brain-trust-cursor-plugin.zip
            release/plugins/agent-brain-trust-claude-plugin.zip
            release/plugins/agent-brain-trust-mcp.zip
            release/skills/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
