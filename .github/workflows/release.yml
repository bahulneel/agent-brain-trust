name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist artefacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-dist
          path: |
            dist/agent-brain-trust-cursor-plugin
            dist/agent-brain-trust-claude-plugin
            dist/agent-brain-trust-mcp
            dist/skill-zips
