name: Release

on:
  push:
    branches:
      - develop
      - main
    paths:
      - package.json
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC for npm trusted publishing (no NPM_TOKEN on publish)
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'release'
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/checkout@v4
        if: github.event_name != 'release'
      - name: Verify release commit updates root package.json
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          if ! git diff-tree --no-commit-id --name-only -r -m HEAD | grep -qx 'package.json'; then
            echo "This workflow runs only when the release tag points at a commit that changes the root package.json."
            exit 1
          fi
      - name: Verify root and MCP package versions match
        run: |
          set -euo pipefail
          ROOT="$(jq -r .version package.json)"
          MCP="$(jq -r .version packages/brain-trust-mcp/package.json)"
          if [ -z "$ROOT" ] || [ "$ROOT" = "null" ] || [ -z "$MCP" ] || [ "$MCP" = "null" ]; then
            echo "Could not read version from package.json files."
            exit 1
          fi
          if [ "$ROOT" != "$MCP" ]; then
            echo "Root package.json version ($ROOT) must match packages/brain-trust-mcp/package.json ($MCP)."
            exit 1
          fi
          echo "Root and MCP versions agree: $ROOT"
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+ for the publish step (see npm docs).
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      # Do not `npm install -g npm@…` here: it can leave a broken global npm on GHA (e.g. missing promise-retry).
      # CI uses the Node-bundled npm for install/build; publish uses a pinned npm via npx below.
      - run: npm ci
      # Workspace builds (includes repo-tooling → dist-tooling/; Turbo orders deps + caches).
      - run: npm run build:packages
      - name: Check dist-tooling matches scripts
        run: git diff --exit-code dist-tooling
      - run: npm run build
      - name: Pack release archives
        run: |
          mkdir -p release/plugins release/skills release/prompts
          cd dist
          zip -q -r ../release/plugins/agent-brain-trust-cursor-plugin.zip agent-brain-trust-cursor-plugin
          zip -q -r ../release/plugins/agent-brain-trust-claude-plugin.zip agent-brain-trust-claude-plugin
          cp skill-zips/*.zip ../release/skills/
          cp prompts/*.md ../release/prompts/
      - name: Upload Cursor plugin artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-cursor-plugin
          path: release/plugins/agent-brain-trust-cursor-plugin.zip
      - name: Upload Claude plugin artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-claude-plugin
          path: release/plugins/agent-brain-trust-claude-plugin.zip
      - name: Upload skill zip artefacts
        uses: actions/upload-artifact@v4
        with:
          name: brain-trust-skill-zips
          path: release/skills/*.zip
      - name: Upload RPL prompt artefact
        uses: actions/upload-artifact@v4
        with:
          name: RPL
          path: release/prompts/RPL.md
      - name: Upload LRPL prompt artefact
        uses: actions/upload-artifact@v4
        with:
          name: LRPL
          path: release/prompts/LRPL.md
      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/plugins/agent-brain-trust-cursor-plugin.zip
            release/plugins/agent-brain-trust-claude-plugin.zip
            release/skills/*.zip
            release/prompts/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish MCP to npm (OIDC trusted publisher)
        if: github.event_name == 'release'
        run: npx --yes npm@11.6.2 publish -w @bahulneel/brain-trust-mcp --access public
