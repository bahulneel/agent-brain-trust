name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:tooling
      - name: Check dist-tooling matches scripts
        run: git diff --exit-code dist-tooling
      - run: npm run validate
      - run: npm run build
      - name: skills-ref (all built skills)
        run: npm run validate:skills-ref
