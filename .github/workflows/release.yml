name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC for npm trusted publishing (no NPM_TOKEN on publish)
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'release'
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/checkout@v4
        if: github.event_name != 'release'
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+ (see npm docs).
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm version for trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      # Workspace builds (includes repo-tooling → dist-tooling/; Turbo orders deps + caches).
      - run: npm run build:packages
      - name: Check dist-tooling matches scripts
        run: git diff --exit-code dist-tooling
      - run: npm run build
      - name: Pack release archives
        run: |
          mkdir -p release/plugins release/skills release/prompts
          cd dist
          zip -q -r ../release/plugins/agent-brain-trust-cursor-plugin.zip agent-brain-trust-cursor-plugin
          zip -q -r ../release/plugins/agent-brain-trust-claude-plugin.zip agent-brain-trust-claude-plugin
          cp skill-zips/*.zip ../release/skills/
          cp prompts/*.md ../release/prompts/
      - name: Upload Cursor plugin artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-cursor-plugin
          path: release/plugins/agent-brain-trust-cursor-plugin.zip
      - name: Upload Claude plugin artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-brain-trust-claude-plugin
          path: release/plugins/agent-brain-trust-claude-plugin.zip
      - name: Upload skill zip artefacts
        uses: actions/upload-artifact@v4
        with:
          name: brain-trust-skill-zips
          path: release/skills/*.zip
      - name: Upload RPL prompt artefact
        uses: actions/upload-artifact@v4
        with:
          name: RPL
          path: release/prompts/RPL.md
      - name: Upload LRPL prompt artefact
        uses: actions/upload-artifact@v4
        with:
          name: LRPL
          path: release/prompts/LRPL.md
      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/plugins/agent-brain-trust-cursor-plugin.zip
            release/plugins/agent-brain-trust-claude-plugin.zip
            release/skills/*.zip
            release/prompts/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish MCP to npm (OIDC trusted publisher)
        if: github.event_name == 'release'
        run: npm publish -w @bahulneel/brain-trust-mcp --access public
